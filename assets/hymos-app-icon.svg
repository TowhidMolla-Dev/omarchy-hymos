<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f2340"/>
      <stop offset="1" stop-color="#07060d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="230" y1="198" x2="905" y2="826">
      <stop offset="0" stop-color="#3de8ff"/>
      <stop offset=".55" stop-color="#7d8cff"/>
      <stop offset="1" stop-color="#c47dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <!-- The Hymos mark: a mouse whose wheel trails into two easing curves. -->
    <g id="mark" fill="none" stroke="url(#flow)" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="44" d="M414 198c-108 0-184 83-184 191v246c0 108 76 191 184 191s184-83 184-191V389c0-108-76-191-184-191Z"/>
      <path stroke-width="40" d="M598 430c91 0 111-92 202-92 43 0 70 23 96 54M598 521c99 0 123 78 212 78 38 0 66-14 91-37"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g transform="translate(256 258) scale(.42) translate(-567 -512)">
      <use href="#mark" filter="url(#glow)" opacity=".8"/>
      <use href="#mark"/>
    </g>
    <rect width="512" height="256" fill="url(#gloss)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
